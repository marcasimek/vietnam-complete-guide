name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, typecheck a testy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalace závislostí
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Datové a unit testy
        run: npm test

      - name: Produkční build
        run: npm run build

      - name: Instalace prohlížeče pro E2E
        run: npx playwright install --with-deps chromium

      - name: End-to-end testy
        run: npx playwright test
        env:
          CI: 'true'

      - name: Uložit report při selhání
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
