name: Deploy na GitHub Pages

on:
  push:
    branches: [main]
  # Ruční spuštění — po zapnutí Pages se deploy dá zopakovat bez nového commitu.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Souběžné nasazení nedává smysl; rozdělaný deploy ale nerušíme.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Kontroly před nasazením
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: 'true'

  build:
    name: Build pro Pages
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build
        run: npm run build

      - name: Kontrola base path a manifestu
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          # Assety musí odkazovat na /vietnam-complete-guide/, ne na kořen.
          grep -q '/vietnam-complete-guide/assets/' dist/index.html
          grep -q '"start_url": *"/vietnam-complete-guide/"' dist/manifest.webmanifest \
            || grep -q '"start_url":"/vietnam-complete-guide/"' dist/manifest.webmanifest
          grep -q '"scope": *"/vietnam-complete-guide/"' dist/manifest.webmanifest \
            || grep -q '"scope":"/vietnam-complete-guide/"' dist/manifest.webmanifest
          # Do nasazení nepatří zadání, interní poznámky ani testovací podklady.
          ! find dist -iname '*master_prompt*' | grep -q . 
          ! find dist -iname 'PROGRESS.md' | grep -q .
          echo "Base path a manifest v pořádku."

      # `enablement: true` přepne zdroj Pages na GitHub Actions, pokud je repo
      # ještě nastavené na „Deploy from a branch". Bez toho by deploy spadl,
      # protože Pages by čekaly soubory ve větvi místo artefaktu z workflow.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Nasazení
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
